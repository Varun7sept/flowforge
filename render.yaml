services:
  - type: web
    name: flowforge-739m
    runtime: go
    buildCommand: go build -o flowforge .
    startCommand: ./flowforge
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flowforge-db
          property: connectionString
      - key: PORT
        value: 8080

  - type: web
    name: flowforge-ui
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://flowforge-739m.onrender.com

databases:
  - name: flowforge-db
    plan: free
